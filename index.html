<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Anti-FOUC theme bootstrap. Runs before paint, applies the .dark class
      and color-scheme so the page renders with the correct palette on the
      very first frame (no light-flash for dark-OS visitors).

      Storage key matches next-themes' default ('theme'), so this mirrors
      whatever ThemeProvider would have applied after hydration.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var systemDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (stored !== 'light' && systemDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
        } catch (e) {
          /* localStorage unavailable (e.g. sandboxed iframe) — let CSS defaults win. */
        }
      })();
    </script>

    <title>Sarah Mitchell | Editorial &amp; Commercial Photographer</title>
